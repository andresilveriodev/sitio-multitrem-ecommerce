version: '3.8'

services:
  # Redis Principal - Para uso geral dos serviços
  redis:
    image: redis:7.2-alpine
    container_name: b3trader-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - ./redis/logs:/var/log/redis
    command: redis-server /usr/local/etc/redis/redis.conf
    environment:
      - TZ=America/Sao_Paulo
    networks:
      - b3trader-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Redis Sentinel para alta disponibilidade (opcional)
  redis-sentinel-1:
    image: redis:7.2-alpine
    container_name: b3trader-redis-sentinel-1
    restart: unless-stopped
    ports:
      - "26379:26379"
    volumes:
      - ./redis/sentinel.conf:/usr/local/etc/redis/sentinel.conf:ro
    command: redis-sentinel /usr/local/etc/redis/sentinel.conf
    environment:
      - TZ=America/Sao_Paulo
    networks:
      - b3trader-network
    depends_on:
      - redis

  # Redis Commander - Interface web para gerenciamento (opcional)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: b3trader-redis-commander
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379
      - HTTP_USER=admin
      - HTTP_PASSWORD=admin123
      - TZ=America/Sao_Paulo
    networks:
      - b3trader-network
    depends_on:
      - redis
    profiles:
      - monitoring

  # Redis Exporter para Prometheus (opcional)
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: b3trader-redis-exporter
    restart: unless-stopped
    ports:
      - "9121:9121"
    environment:
      - REDIS_ADDR=redis://redis:6379
      - TZ=America/Sao_Paulo
    networks:
      - b3trader-network
    depends_on:
      - redis
    profiles:
      - monitoring

volumes:
  redis_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./redis/data

networks:
  b3trader-network:
    driver: bridge
    name: b3trader-network


